<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактор CSS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 600px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #eee;
        }

        h3 {
            margin-top: 0;
            color: #ffcc00;
        }

        textarea {
            width: 100%;
            height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: #2d2d3d;
            color: #eee;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            resize: vertical;
        }

        .button-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #357abd;
            }

            button.save {
                background: #28a745;
            }

                button.save:hover {
                    background: #218838;
                }

            button.reset {
                background: #dc3545;
            }

                button.reset:hover {
                    background: #c82333;
                }

        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

            .status.success {
                background: #28a745;
                display: block;
            }

            .status.error {
                background: #dc3545;
                display: block;
            }
    </style>
</head>
<body>
    <h3>✏️ Редактор style.css для forum.blackrussia.online</h3>
    <textarea id="cssEditor" placeholder="Введите ваш CSS здесь..."></textarea>

    <div class="button-group">
        <button id="saveBtn" class="save">💾 Сохранить</button>
        <button id="resetBtn" class="reset">🔄 Сбросить</button>
    </div>
    <div id="status" class="status"></div>

    <script src="popup.js"></script>
</body>
</html>
